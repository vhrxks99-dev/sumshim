<!-- ═══ 상담 후기 — 게시판 한 장 (review.html) ═══
     2026-08-24 원장 지시로 홈 섹션에서 따로 뺐다. 홈에는 맛보기(reviews-home)만 남는다. -->
<section class="band" id="reviews">
  <div class="wrap">
    <p class="eyebrow rv">상담 후기</p>
    <h2 class="rv rv-wide">방문해 주신 분들이 직접 남겨주신 후기입니다.<br>이름 대신 연령대와 상담 유형만 표시합니다.</h2>

    <div class="reviews rv" id="reviews-list"></div>
    <p class="rv" id="reviews-empty" style="display:none;color:var(--ink-soft);font-size:15px;line-height:1.9;margin:0">
      아직 남겨주신 후기가 없습니다.<br>첫 후기를 기다리고 있습니다.</p>

    <p class="hint rv" style="margin-top:22px">내담자의 개인정보와 상담 내용 보호를 가장 우선합니다.</p>

    <!-- ── 후기 남기기 ───────────────────────────────────────── -->
    <details class="rvform rv" id="rvBox">
      <summary>후기 남기기</summary>

      <form class="form" id="rvForm" novalidate>
        <div>
          <label for="rv-body">후기 내용<span class="req">*</span></label>
          <textarea id="rv-body" maxlength="2000" placeholder="상담을 받으며 느끼신 점을 편하게 적어주세요."></textarea>
          <p class="hint">열 글자 이상 적어주세요. 이름·연락처는 받지 않습니다.</p>
        </div>

        <div>
          <label for="rv-label">어떻게 표기할까요<span class="req">*</span></label>
          <input type="text" id="rv-label" maxlength="40" placeholder="예: 30대 · 개인상담">
          <p class="hint">후기 아래에 이 글자만 표시됩니다.</p>
        </div>

        <!-- 사람 눈에는 보이지 않는 칸입니다. 광고 프로그램만 여기에 글을 채웁니다. -->
        <div class="rvtrap" aria-hidden="true">
          <label for="rv-web">홈페이지 주소</label>
          <input type="text" id="rv-web" tabindex="-1" autocomplete="off">
        </div>

        <div class="agree">
          <input type="checkbox" id="rv-agree">
          <label for="rv-agree">홈페이지 공개에 동의합니다.<span class="req">*</span>
            적어주신 내용과 표기가 홈페이지에 그대로 올라갑니다.
            개인을 알아볼 수 있는 내용은 적지 말아주세요.</label>
        </div>

        <div class="formmsg" id="rvMsg"></div>

        <div>
          <button type="submit" class="btn btn-solid" id="rvSend"
                  style="cursor:pointer;font-family:inherit;border:0">후기 남기기</button>
        </div>
      </form>
    </details>
  </div>
</section>
