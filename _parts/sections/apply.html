<!-- ═══ 상담 신청 ═══ -->
<section class="band band--deeper" id="apply">
  <div class="wrap">
    <p class="eyebrow rv" style="color:#9FC6DA">상담 신청</p>
    <h2 class="rv read">초기 상담에 필요한 만큼만 남겨주세요.</h2>
    <p class="rv read" style="color:#B6CEDC;margin-bottom:40px">
      상담 특성상 민감한 내용이 많기 때문에, 신청 단계에서는 자세한 사정을 적지 않으셔도 됩니다.
      자세한 이야기는 첫 상담에서 천천히 나눕니다.</p>

    <form class="form rv" id="applyForm" novalidate
          style="background:var(--surface);color:var(--ink);padding:36px 34px;border-radius:14px;max-width:700px">
      <div class="row">
        <div><label for="f-name">이름<span class="req">*</span></label>
          <input type="text" id="f-name" autocomplete="name" placeholder="성함"></div>
        <div><label for="f-tel">연락처<span class="req">*</span></label>
          <input type="tel" id="f-tel" autocomplete="tel" placeholder="010-0000-0000"></div>
      </div>
      <div class="row">
        <div><label for="f-age">연령대</label>
          <select id="f-age">
            <option value="">선택하지 않음</option>
            <option>10대</option><option>20대</option><option>30대</option>
            <option>40대</option><option>50대</option><option>60대 이상</option>
          </select></div>
        <div><label for="f-type">상담 희망 방식</label>
          <select id="f-type">
            <option value="">아직 정하지 못했습니다</option>
            <option>개인 심리상담</option>
            <option>미술치료</option>
            <option>둘 다 알아보고 싶습니다</option>
          </select></div>
      </div>
      <div><label for="f-when">상담 가능한 요일 · 시간</label>
        <input type="text" id="f-when" placeholder="예: 평일 저녁, 토요일 오전">
        <p class="hint">가능한 시간을 두 개 이상 적어주시면 일정을 잡기 수월합니다.</p></div>
      <div><label for="f-why">상담을 신청하게 된 이유</label>
        <textarea id="f-why" placeholder="한두 문장이면 충분합니다."></textarea>
        <p class="hint">자세히 쓰지 않으셔도 됩니다. 지금 가장 걸리는 것 한 가지면 됩니다.</p></div>
      <div><label for="f-prev">이전 상담 경험</label>
        <select id="f-prev">
          <option value="">선택하지 않음</option>
          <option>처음입니다</option>
          <option>받아본 적 있습니다</option>
          <option>현재 다른 곳에서 받고 있습니다</option>
        </select></div>
      <div class="agree">
        <input type="checkbox" id="f-agree">
        <label for="f-agree">개인정보 수집·이용에 동의합니다.<span class="req">*</span>
          상담 일정 안내를 위해 이름·연락처를 수집하며, 상담 종료 후 3년간 보관 뒤 파기합니다.
          <a href="#" id="ppLink" style="color:var(--sky-deep)">자세히 보기</a></label>
      </div>
      <div class="formmsg" id="formMsg"></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button type="submit" class="btn btn-solid" style="cursor:pointer;font-family:inherit;border:0">
          카카오톡으로 신청 보내기</button>
        <button type="button" class="btn btn-line" id="mailBtn" style="cursor:pointer;font-family:inherit">
          이메일로 보내기</button>
      </div>
      <p class="hint" style="margin:0">전화가 편하시면 <a href="tel:01094559580" style="color:var(--sky-deep)">010-9455-9580</a>으로 연락 주셔도 됩니다.</p>
    </form>
  </div>
</section>
