<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>후기 관리 · 쉬는숨쉬는쉼 상담센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--surface:#FCFBF8;--ivory:#F4EFE6;--sky:#7FB0CC;--sky-deep:#3A6E8C;
      --ink:#24313A;--ink-soft:#6B7C87;--mist:#DCE6EB}
*{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);
     font-family:'IBM Plex Sans KR',-apple-system,sans-serif;font-size:15px;line-height:1.75}
.wrap{max-width:820px;margin:0 auto;padding:38px 20px 90px}
h1{font-family:'Gowun Batang',serif;font-size:26px;font-weight:400;margin:0 0 6px}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 30px}
.card{background:var(--surface);border:1px solid var(--mist);border-radius:12px;padding:26px 24px;margin-bottom:16px}
label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
input[type=email],input[type=password]{width:100%;max-width:360px;padding:13px 15px;
     border:1px solid var(--mist);border-radius:9px;font-family:inherit;font-size:15px;
     background:#fff;color:var(--ink);margin-bottom:16px}
input[type=email]:focus,input[type=password]:focus{outline:2px solid var(--sky);outline-offset:1px;border-color:var(--sky)}
.linkish{background:none;border:0;padding:0;color:var(--sky-deep);text-decoration:underline;
     font-size:13.5px;cursor:pointer}
.linkish:hover{background:none}
button{font-family:inherit;font-size:14.5px;border-radius:8px;cursor:pointer;padding:10px 18px;
       border:1px solid var(--mist);background:#fff;color:var(--ink)}
button:hover{background:var(--ivory)}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff;padding:13px 26px;font-size:15px}
.primary:hover{background:#33627d}
.danger{color:#8C3F2C;border-color:#E7CFC7}
.danger:hover{background:#FBEEEA}
.msg{font-size:14.5px;line-height:1.8;padding:14px 16px;border-radius:9px;margin:18px 0 0;display:none}
.msg.err{display:block;background:#FBEEEA;color:#8C3F2C}
.msg.ok{display:block;background:#EAF2F7;color:var(--sky-deep)}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
     font-size:13.5px;color:var(--ink-soft);margin-bottom:18px}
.item{background:var(--surface);border:1px solid var(--mist);border-radius:12px;padding:22px 22px 16px;margin-bottom:12px}
.item.off{background:#F1F1EE;border-style:dashed}
.item .body{font-family:'Gowun Batang',serif;font-size:16.5px;line-height:1.95;margin:0 0 14px;white-space:pre-wrap}
.item .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
     font-size:13px;color:var(--ink-soft);border-top:1px solid var(--mist);padding-top:13px}
.item .acts{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;background:#E3E3DE;color:#6B6B63;margin-left:7px}
.empty{color:var(--ink-soft);padding:26px 0}
.foot{margin-top:34px;font-size:13px;color:#8B9AA4}
.foot a{color:var(--sky-deep)}
</style>
</head>
<body>
<div class="wrap">
  <h1>후기 관리</h1>
  <p class="sub">쉬는숨쉬는쉼 상담센터 · 홈페이지에 올라온 후기를 숨기거나 지웁니다.</p>

  <!-- 로그인 전 -->
  <div class="card" id="loginBox" style="display:none">
    <form id="loginForm" novalidate>
      <label for="em">이메일</label>
      <input type="email" id="em" autocomplete="email" placeholder="관리자 이메일">

      <label for="pw">비밀번호</label>
      <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호">

      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button type="submit" class="primary" id="go">로그인</button>
        <button type="button" class="linkish" id="toggle">처음이신가요? 가입하기</button>
      </div>
      <p class="sub" id="pwHint" style="margin:16px 0 0;display:none">
        비밀번호는 여섯 글자 이상으로 정해주세요. 이 화면에서 원장님이 직접 정하시는 것이라
        다른 사람은 알 수 없습니다. 브라우저에 저장해 두시면 다음부터는 누르기만 하면 됩니다.</p>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>

  <!-- 로그인 후 -->
  <div id="adminBox" style="display:none">
    <div class="who">
      <span id="whoami"></span>
      <button id="out">로그아웃</button>
    </div>
    <div class="msg" id="adminMsg"></div>
    <div id="list"></div>
  </div>

  <p class="foot" id="foot" style="display:none">
    이 화면은 검색에도 나오지 않고 메뉴에도 없습니다. 주소를 아는 사람만 들어옵니다.<br>
    <a href="../index.html">홈페이지로 돌아가기</a>
  </p>
</div>

<script>
var SB_URL = 'https://ybtxwywqhirltloinfju.supabase.co';
var SB_KEY = 'sb_publishable_svvJEf4Obdq24Z4dMsqurw_f_dDRU17';

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); };
var say = function(el, kind, text){ el.className = 'msg ' + kind; el.textContent = text; };

/* ── 로그인 표(토큰) 보관 ──────────────────────────────────────
   한 번 로그인하면 이 기기에 표가 남아 있어서 주소만 치면 바로 열린다.
   표가 오래되면 조용히 새로 받아온다. */
function keep(k, v){
  try{ v ? localStorage.setItem(k, v) : localStorage.removeItem(k); }catch(e){}
}
function token(){    try{ return localStorage.getItem('sumshim_tok') || ''; }catch(e){ return ''; } }
function refToken(){ try{ return localStorage.getItem('sumshim_ref') || ''; }catch(e){ return ''; } }
function setSession(acc, ref){ keep('sumshim_tok', acc); keep('sumshim_ref', ref); }

/* 메일 링크를 타고 오면 주소 뒤에 표가 붙어 있다. 챙긴 뒤 주소는 깨끗하게 지운다 */
(function(){
  if(location.hash.indexOf('access_token=') < 0) return;
  var p = new URLSearchParams(location.hash.slice(1));
  if(p.get('access_token')) setSession(p.get('access_token'), p.get('refresh_token') || '');
  history.replaceState(null, '', location.pathname);
})();

/* 표가 만료됐을 때 조용히 새로 받아온다.
   실패했다고 지우지 않는다 — 창을 두 개 열어 두면 늦게 도착한 쪽이 거절당하는데
   그때 지워버리면 멀쩡한 로그인이 풀린다(2026-08-24에 실제로 겪음). */
var renewing = null;
function renew(){
  if(renewing) return renewing;
  var r = refToken();
  if(!r) return Promise.resolve(false);
  renewing = fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST',
    headers:{ apikey: SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: r })
  })
  .then(function(res){
    return res.json().catch(function(){ return null; })
      .then(function(j){ return { ok:res.ok, status:res.status, j:j }; });
  })
  .then(function(out){
    if(out.ok && out.j && out.j.access_token){
      setSession(out.j.access_token, out.j.refresh_token || r);
      return true;
    }
    if(refToken() && refToken() !== r) return true;   // 다른 창이 먼저 받아 뒀다
    if(out.status === 400 || out.status === 401) setSession('', '');
    return false;
  })
  .catch(function(){ return false; })
  .then(function(v){ renewing = null; return v; });
  return renewing;
}

function api(path, opt){
  opt = opt || {};
  var h = { apikey: SB_KEY, Authorization: 'Bearer ' + (token() || SB_KEY) };
  var extra = opt.headers || {};
  for(var k in extra) h[k] = extra[k];
  opt.headers = h;
  return fetch(SB_URL + path, opt);
}

/* ── 화면 고르기 ──────────────────────────────────────────────── */
function showLogin(text){
  $('loginBox').style.display = '';
  $('adminBox').style.display = 'none';
  $('foot').style.display = '';
  if(text) say($('loginMsg'), 'err', text);
}

function me(){
  return api('/auth/v1/user')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){ return (u && u.email) ? u : null; })
    .catch(function(){ return null; });
}

function afterLogin(u){
  return api('/rest/v1/rpc/sumshim_is_admin', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' })
    .then(function(r){ return r.json(); })
    .then(function(ok){
      if(ok !== true){
        setSession('', '');
        showLogin(u.email + ' 은(는) 관리자로 등록되어 있지 않습니다.');
        return;
      }
      $('loginBox').style.display = 'none';
      $('adminBox').style.display = '';
      $('whoami').textContent = u.email + ' 으로 로그인되어 있습니다.';
      load();
    });
}

function start(){
  $('foot').style.display = '';
  if(!token() && !refToken()){ showLogin(); return; }

  me().then(function(u){
    if(u) return afterLogin(u);
    /* 표가 오래됐다 — 조용히 새로 받아서 다시 해본다 */
    return renew().then(function(ok){
      if(!ok){ setSession('', ''); showLogin('로그인이 풀렸습니다. 다시 로그인해 주세요.'); return; }
      return me().then(function(u2){
        if(!u2){ setSession('', ''); showLogin('로그인이 풀렸습니다. 다시 로그인해 주세요.'); return; }
        return afterLogin(u2);
      });
    });
  })
  .catch(function(){ showLogin('연결이 되지 않았습니다. 잠시 뒤 다시 시도해 주세요.'); });
}

/* ── 로그인 / 가입 ────────────────────────────────────────────
   손님은 가입하지 않는다. 후기만 쓴다.
   여기서 가입하는 사람은 관리자뿐이고, 그마저도 관리자 명단(sumshim_admins)에
   이메일이 들어 있어야 후기를 고치거나 지울 수 있다.
   가입만 해두고 명단에 없으면 아무것도 못 한다. */
var signup = false;

$('toggle').addEventListener('click', function(){
  signup = !signup;
  $('go').textContent      = signup ? '가입하기' : '로그인';
  this.textContent         = signup ? '이미 가입하셨나요? 로그인' : '처음이신가요? 가입하기';
  $('pw').autocomplete     = signup ? 'new-password' : 'current-password';
  $('pwHint').style.display = signup ? '' : 'none';
  $('loginMsg').className   = 'msg';
});

$('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var em = ($('em').value || '').trim();
  var pw = $('pw').value || '';

  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))
    return say($('loginMsg'), 'err', '이메일 주소를 다시 확인해 주세요.');
  if(pw.length < 6)
    return say($('loginMsg'), 'err', '비밀번호는 여섯 글자 이상이어야 합니다.');

  var btn = $('go'); btn.disabled = true;
  say($('loginMsg'), 'ok', signup ? '가입하는 중입니다…' : '들어가는 중입니다…');

  var url = signup ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';

  fetch(SB_URL + url, {
    method:'POST',
    headers:{ apikey: SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email: em, password: pw })
  })
  .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
  .then(function(res){
    btn.disabled = false;

    if(!res.ok){
      var m = (res.j && (res.j.msg || res.j.error_description || res.j.message)) || '';
      if(/Invalid login/i.test(m))
        return say($('loginMsg'), 'err', '이메일이나 비밀번호가 맞지 않습니다.');
      if(/허용되지 않은 이메일/.test(m))
        return show('err', '이 이메일은 가입할 수 없습니다. 관리자 명단에 올라 있는 이메일만 가입됩니다.');
      if(/already registered|already been registered/i.test(m))
        return say($('loginMsg'), 'err', '이미 가입된 이메일입니다. 「로그인」으로 바꿔서 들어가세요.');
      if(/Email not confirmed/i.test(m))
        return say($('loginMsg'), 'err', '메일함에서 확인 메일을 한 번 눌러주셔야 합니다.');
      return say($('loginMsg'), 'err', '들어가지 못했습니다. 잠시 뒤 다시 시도해 주세요.');
    }

    /* 가입했는데 표를 안 주면 = 확인 메일을 눌러야 하는 설정이다 */
    if(!res.j.access_token){
      return say($('loginMsg'), 'ok',
        '가입되었습니다. 메일함에서 확인 메일을 한 번 눌러주신 뒤 로그인해 주세요.');
    }

    setSession(res.j.access_token, res.j.refresh_token || '');
    $('pw').value = '';
    $('loginMsg').className = 'msg';
    start();
  })
  .catch(function(){
    btn.disabled = false;
    say($('loginMsg'), 'err', '연결이 되지 않았습니다. 잠시 뒤 다시 시도해 주세요.');
  });
});

$('out').addEventListener('click', function(){ setSession('', ''); location.reload(); });

/* ── 후기 목록 ────────────────────────────────────────────────── */
function fmt(iso){
  var d = new Date(iso); if(isNaN(d.getTime())) return '';
  var p = function(n){ return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '.' + p(d.getMonth()+1) + '.' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function load(){
  api('/rest/v1/sumshim_reviews?select=*&order=created_at.desc')
  .then(function(r){ return r.ok ? r.json() : []; })
  .then(function(rows){
    if(!rows.length){ $('list').innerHTML = '<p class="empty">아직 올라온 후기가 없습니다.</p>'; return; }
    $('list').innerHTML = rows.map(function(r){
      var off = r.status === 'hidden';
      return '<div class="item' + (off ? ' off' : '') + '" data-id="' + esc(r.id) + '">'
        + '<p class="body">' + esc(r.body) + '</p>'
        + '<div class="meta"><span>' + esc(r.label)
        + (off ? '<span class="tag">숨김</span>' : '') + ' · ' + fmt(r.created_at) + '</span>'
        + '<span class="acts">'
        +   '<button data-act="' + (off ? 'show' : 'hide') + '">' + (off ? '다시 보이기' : '숨기기') + '</button>'
        +   '<button class="danger" data-act="del">지우기</button>'
        + '</span></div></div>';
    }).join('');
  });
}

$('list').addEventListener('click', function(e){
  var btn = e.target.closest('button'); if(!btn) return;
  var item = btn.closest('.item'); if(!item) return;
  var id = item.getAttribute('data-id');
  var act = btn.getAttribute('data-act');

  if(act === 'hide' || act === 'show'){
    btn.disabled = true;
    api('/rest/v1/sumshim_reviews?id=eq.' + id, {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ status: act === 'hide' ? 'hidden' : 'visible' })
    }).then(function(r){
      if(!r.ok) return say($('adminMsg'), 'err', '바꾸지 못했습니다.');
      say($('adminMsg'), 'ok', act === 'hide'
        ? '숨겼습니다. 홈페이지에서 보이지 않습니다.' : '다시 보이게 했습니다.');
      load();
    });
    return;
  }

  /* 지우기는 되돌릴 수 없으므로 한 번 더 묻는다 */
  if(act === 'del'){
    btn.outerHTML = '<button class="danger" data-act="del-yes">정말 지웁니다</button>'
                  + '<button data-act="del-no">그만두기</button>';
    return;
  }
  if(act === 'del-no'){ load(); return; }
  if(act === 'del-yes'){
    btn.disabled = true;
    api('/rest/v1/sumshim_reviews?id=eq.' + id, { method:'DELETE' })
    .then(function(r){
      if(!r.ok) return say($('adminMsg'), 'err', '지우지 못했습니다.');
      say($('adminMsg'), 'ok', '지웠습니다.');
      load();
    });
  }
});

start();
</script>
</body>
</html>
